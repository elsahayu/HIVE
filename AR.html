<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Hijaiyah Verse</title>

  <!-- ========== ANTI IFRAME (WAJIB UNTUK STUDENT PORTAL) ========== -->
  <script>
    if (window.self !== window.top) {
      window.top.location = window.location.href;
    }
  </script>
  <!-- ============================================================== -->

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* FULLSCREEN FIX */
  a-scene {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
  }

  .a-canvas,
  .a-canvas canvas,
  a-scene > div {
    width: 100vw !important;
    height: 100vh !important;
  }

  /* HAPUS VR BUTTON */
  .a-enter-vr,
  .a-enter-vr-button,
  .a-enter-ar-button,
  .a-enter-vr-modal {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }

  #btnKeluar {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 10px 16px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
  }

  #markerStatus {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
  }

  /* ========== UI DIKECILKAN + DIPUSATKAN + DIBUAT LEBIH ATAS ========== */
  #papanWrapper {
    position: fixed;
    bottom: 18%;
    left: 45%;
    transform: translateX(-50%);
    width: 260px;
    display: none;
    z-index: 200;
  }

  #papan {
    background: white;
    padding: 18px;
    border-radius: 18px;
    width: 100%;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    text-align: center;
  }

  #menuTitle {
    font-size: 1.3rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 14px;
  }

  .menuBtn {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
  }

  #btnDengar  { background: #127a4f; }
  #btnLatihan { background: #2f90c6; }
  /* ================================================================= */

</style>

</head>

<body>

<!-- UI Atas -->
<button id="btnKeluar">Keluar</button>
<div id="markerStatus">Marker belum terdeteksi</div>

<!-- PAPAN TULIS -->
<div id="papanWrapper">
  <div style="display:flex; align-items:center; gap:12px; justify-content:center;">
    
    <div id="papan">
      <div id="menuTitle">Pilih Mode</div>
      <button id="btnDengar" class="menuBtn">🔊 Dengar</button>
      <button id="btnLatihan" class="menuBtn">🎙 Mulai Latihan</button>
    </div>

    <!-- GAMBAR PAK (PNG) -->
    <img src="ASSET/pak.png" style="width:95px; height:auto;">

  </div>
</div>

<!-- ====== AR Scene ====== -->
<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
  <!-- 3D asset dihapus -->

  <a-marker type="pattern" url="markers/bismillah.patt" id="hiroMarker"></a-marker>

  <a-entity camera></a-entity>
</a-scene>


<script>
  const marker = document.getElementById("hiroMarker");
  const markerStatus = document.getElementById("markerStatus");
  const papanWrapper = document.getElementById("papanWrapper");

  marker.addEventListener("markerFound", () => {
    markerStatus.textContent = "Marker terdeteksi";
    papanWrapper.style.display = "block";
  });

  marker.addEventListener("markerLost", () => {
    markerStatus.textContent = "Marker belum terdeteksi";
    papanWrapper.style.display = "none";
  });

  document.getElementById("btnDengar").onclick = () => {
    window.location.href = "dengar.html";
  };

  document.getElementById("btnLatihan").onclick = () => {
    window.location.href = "latihan.html";
  };

  document.getElementById("btnKeluar").onclick = () => {
    window.location.href = "index.html";
  };
</script>

</body>
</html>
